<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Utility Library Project</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
            min-height: 100vh;
        }

        /* Header */
        header {
            background: #2d2f91;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 26px;
            letter-spacing: 1px;
        }

        /* Main Container */
        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .title {
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
            color: #333;
        }

        /* Input Section */
        .input-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        input {
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
        }

        /* Buttons */
        .btn-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        button {
            padding: 12px;
            font-size: 15px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #388e3c;
        }

        /* Output */
        .output-box {
            background: #f3f3f3;
            border-left: 6px solid #4CAF50;
            padding: 15px;
            font-size: 18px;
            min-height: 50px;
            border-radius: 5px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 15px;
            color: white;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
   
</header>

<div class="container">

    <div class="title">JavaScript Utility Functions</div>

    <!-- Input Section -->
    <div class="input-section">
        <input type="text" id="text" placeholder="Enter text here">
        <input type="number" id="number" placeholder="Enter number here">
    </div>

    <!-- Buttons -->
    <div class="btn-group">
        <button onclick="convertUpper()">Uppercase</button>
        <button onclick="countCharacters()">Count Characters</button>
        <button onclick="squareNumber()">Square</button>
        <button onclick="checkNumber()">Positive / Negative</button>
        <button onclick="removeSpaces()">Remove Spaces</button>
       
    </div>

    <!-- Output -->
    <div class="output-box" id="result">
        Output will be shown here...
    </div>

</div>



<script>
    function convertUpper() {
        let text = document.getElementById("text").value;
        document.getElementById("result").innerHTML =
            text.toUpperCase();
    }

    function countCharacters() {
        let text = document.getElementById("text").value;
        document.getElementById("result").innerHTML =
            "Total Characters: " + text.length;
    }

    function squareNumber() {
        let num = document.getElementById("number").value;
        document.getElementById("result").innerHTML =
            "Square = " + (num * num);
    }

    function checkNumber() {
        let num = document.getElementById("number").value;

        if (num > 0)
            document.getElementById("result").innerHTML = "Positive Number";
        else if (num < 0)
            document.getElementById("result").innerHTML = "Negative Number";
        else
            document.getElementById("result").innerHTML = "Zero";
    }

    function removeSpaces() {
        let text = document.getElementById("text").value;
        document.getElementById("result").innerHTML =
            text.replaceAll(" ", "");
    }


</script>

</body>
</html>
