<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Professional Calculator</title>

<style>
    * {
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, sans-serif;
    }

    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(to right, #141e30, #243b55);
    }

    .calculator {
        width: 500px;
        background: #ffffff;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .calculator h1 {
        text-align: center;
        margin-bottom: 30px;
        color: #243b55;
        letter-spacing: 1px;
    }

    .row {
        margin-bottom: 20px;
    }

    label {
        font-weight: 600;
        display: block;
        margin-bottom: 8px;
        color: #333;
    }

    input, select {
        width: 100%;
        padding: 14px;
        font-size: 18px;
        border-radius: 10px;
        border: 1px solid #ccc;
        outline: none;
    }

    input:focus, select:focus {
        border-color: #243b55;
    }

    button {
        width: 100%;
        padding: 15px;
        font-size: 20px;
        font-weight: bold;
        background: #243b55;
        color: #fff;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #1b2e4b;
    }

    #result {
        margin-top: 25px;
        padding: 15px;
        text-align: center;
        font-size: 22px;
        font-weight: bold;
        background: #f1f4f9;
        border-radius: 10px;
        color: #243b55;
    }
</style>
</head>

<body>

<div class="calculator">
    <h1>Calculator</h1>

    <div class="row">
        <label>First Number</label>
        <input type="number" id="num1" placeholder="Enter first number">
    </div>

    <div class="row">
        <label>Second Number</label>
        <input type="number" id="num2" placeholder="Enter second number">
    </div>

    <div class="row">
        <label>Operation</label>
        <select id="operator">
            <option value="+">Addition (+)</option>
            <option value="-">Subtraction (-)</option>
            <option value="*">Multiplication (×)</option>
            <option value="/">Division (÷)</option>
        </select>
    </div>

    <button onclick="calculate()">Calculate</button>

    <div id="result">Result will appear here</div>
</div>

<script>
function calculate() {
    let num1 = Number(document.getElementById("num1").value);
    let num2 = Number(document.getElementById("num2").value);
    let operator = document.getElementById("operator").value;
    let result;

    if (operator === "+") {
        result = num1 + num2;

    } else if (operator === "-") {
        result = num1 - num2;

    } else if (operator === "*") {
        result = num1 * num2;

    } else if (operator === "/") {
        if (num2 === 0) {
            result = "Error: Division by zero is not allowed";
        } else {
            result = num1 / num2;
        }

    } else {
        result = "Invalid operator";
    }

    document.getElementById("result").innerText = "Result: " + result;
}
</script>

</body>
</html>
